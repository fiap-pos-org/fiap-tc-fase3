[project]
name = "hospital-assistant"
version = "0.1.0"
description = "Assistente virtual médico com fine-tuning de LLM, LangChain e LangGraph (Tech Challenge Fase 3, FIAP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
data = [
    "faker>=40.63.0",
    "pt-core-news-md",
    "spacy>=3.8.18",
]
train = [
    "accelerate>=1.16.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.2.0",
    "peft>=0.22.0",
    "torch>=2.15.0",
    "transformers>=5.24.0",
    "trl>=1.18.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # linhas longas ficam a cargo do ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Localmente instala tudo; a imagem Docker usa --no-default-groups (só o runtime da app).
default-groups = "all"

[tool.uv.sources]
pt-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_md-3.8.0/pt_core_news_md-3.8.0-py3-none-any.whl" }
