[project]
name = "hospital-assistant"
version = "0.1.0"
description = "Assistente virtual médico com fine-tuning de LLM, LangChain e LangGraph (Tech Challenge Fase 3, FIAP)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faker>=40.63.0",
    "pt-core-news-md",
    "spacy>=3.8.18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # linhas longas ficam a cargo do ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
pt-core-news-md = { url = "https://github.com/explosion/spacy-models/releases/download/pt_core_news_md-3.8.0/pt_core_news_md-3.8.0-py3-none-any.whl" }
