<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 920 372' width='920' role='img' aria-label='Arquitetura: o modelo só redige; fatos vêm do prontuário e dos protocolos; a triagem pausa até o médico decidir; cada etapa vai para a auditoria' font-family='Segoe UI, Helvetica, Arial, sans-serif'><defs><marker id='seta' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#818b98'/></marker><marker id='seta-humano' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#bc4c00'/></marker></defs><rect x='20' y='177' width='110' height='56' rx='8' fill='#ffffff' stroke='#d1d9e0' stroke-width='1.5'/><text x='75.0' y='210.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Médico</text><rect x='190' y='169' width='150' height='72' rx='8' fill='#ffffff' stroke='#d1d9e0' stroke-width='1.5'/><text x='265.0' y='201.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Interface + API</text><text x='265.0' y='218.0' text-anchor='middle' font-size='11' fill='#59636e'>Tabler, FastAPI, login</text><polyline points='130,205 188,205' fill='none' stroke='#818b98' stroke-width='1.5' marker-end='url(#seta)'/><text x='159' y='197' text-anchor='middle' font-size='11' fill='#59636e'>pergunta</text><rect x='400' y='50' width='230' height='310' rx='10' fill='#f6f8fa' stroke='#d1d9e0' stroke-dasharray='4 4'/><text x='515' y='348' text-anchor='middle' font-size='11' fill='#59636e'>LangGraph + LangChain</text><rect x='420' y='80' width='190' height='64' rx='8' fill='#ffffff' stroke='#d1d9e0' stroke-width='1.5'/><text x='515.0' y='108.0' text-anchor='middle' font-size='13' font-weight='600' fill='#1f2328'>Fluxo A: triagem</text><text x='515.0' y='125.0' text-anchor='middle' font-size='11' fill='#59636e'>pendências, críticos, alertas</text><rect x='420' y='250' width='190' height='64' rx='8' fill='#f